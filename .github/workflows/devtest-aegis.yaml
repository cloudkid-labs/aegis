name: Devtest Aegis
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tools.json"
      - "migrations/**"
      - "package.json"
      - "wrangler.jsonc"
      - "vitest.config.mts"
      - ".github/workflows/devtest-aegis.yaml"
      - ".github/workflows/aegis-explore.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx wrangler deploy --dry-run