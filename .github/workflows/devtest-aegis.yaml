name: Devtest Aegis
on:
  pull_request:
    paths:
      - "src/**"
      - "astro.config.mjs"
      - "tools.json"
      - "migrations/**"
      - "package.json"
      - "yarn.lock"
      - "wrangler.jsonc"
      - "vitest.config.mts"
      - "vitest.global-setup.mts"
      - ".github/workflows/devtest-aegis.yaml"
      - ".github/workflows/aegis-explore.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: yarn install --frozen-lockfile
      # The workers vitest project and the deploy dry-run both read the Astro
      # build in ./dist through wrangler.jsonc's ASSETS binding.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx wrangler deploy --dry-run